services:
  bot:
    build: .
    env_file: .env
    environment:
      DB_PATH: /app/data/upgrade_gift.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # HTTPS для мини-аппа: Caddy сам получит сертификат Let's Encrypt для jsqvpn.online
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - bot
    restart: unless-stopped

volumes:
  caddy_data:
